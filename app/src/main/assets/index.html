<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RanzPinball">
<title>RanzPinball</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: one-screen arcade cabinet. HUD strip on top, table + tall launcher rail in the middle, two big flipper buttons at the bottom. Single dark "cave" look. */
:root{
  --bg:#15110e;        /* cave dark */
  --panel:#2b221b;     /* packed dirt */
  --panel-hi:#3d3127;
  --fg:#f1e7d4;
  --dim:#a39480;
  --accent:#5fd6c8;    /* diamond */
  --gold:#f2c14e;
  --grass:#68a845;
  --display:"Silkscreen", "Courier New", monospace;
  --body:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px}

/* HUD */
#hud{display:flex;align-items:stretch;gap:6px;font-family:var(--display)}
.cell{background:var(--panel);padding:5px 8px;display:flex;flex-direction:column;justify-content:center;gap:1px;
  box-shadow:inset 0 0 0 2px #0008, inset 2px 2px 0 2px #ffffff10;min-width:0}
.cell small{font-size:9px;letter-spacing:.12em;color:var(--dim)}
.cell b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoreCell{flex:1}
#scoreCell b{font-size:19px;color:var(--gold)}
#balls{display:flex;gap:3px;height:15px;align-items:center}
#balls i{width:9px;height:9px;background:#d9d9de;box-shadow:inset -2px -2px 0 #7a7a82}
#balls i.gone{background:#3a3029;box-shadow:none}
#multCell b{color:var(--accent)}
#mute,#menuBtn{font-family:var(--display);font-size:10px;color:var(--fg);background:var(--panel);border:0;padding:0 8px;cursor:pointer;
  box-shadow:inset 0 0 0 2px #0008, inset 2px 2px 0 2px #ffffff10}
#mute[aria-pressed="true"]{color:var(--dim)}
#menuBtn{color:var(--gold)}
@media (max-width:370px){#hiCell{display:none}}

/* Middle: table + launcher */
#mid{display:flex;justify-content:center;align-items:stretch;gap:8px;min-height:0}
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
canvas{display:block;image-rendering:pixelated;box-shadow:0 0 0 3px #000, 0 0 0 6px var(--panel-hi)}

#launcher{width:54px;display:flex;flex-direction:column;gap:6px;flex:none}
#rail{position:relative;flex:1;background:#1d1713;touch-action:none;cursor:grab;overflow:hidden;
  box-shadow:inset 0 0 0 3px #000, inset 3px 3px 0 3px #ffffff0d}
#rail.off{opacity:.45;cursor:default}
#knob{position:absolute;left:6px;right:6px;top:8px;height:58px;background:linear-gradient(#e0b04a,#b67f24);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:9px;color:#3a2508;letter-spacing:.06em;
  box-shadow:inset 0 0 0 2px #2a1a06, inset 3px 3px 0 2px #ffe8a3, inset -3px -3px 0 2px #8a5a14;will-change:transform}
#spring{position:absolute;left:15px;right:15px;bottom:8px;
  background-image:linear-gradient(to bottom,#c8c9d0 0 38%,#6c6d75 38% 55%,transparent 55% 100%);background-repeat:repeat-y}
#meter{position:absolute;left:3px;bottom:3px;width:3px;background:var(--gold);height:0}
#launchLabel{font-family:var(--display);font-size:9px;text-align:center;color:var(--dim);letter-spacing:.08em}
#rail.armed #knob{filter:brightness(1.15)}

/* Flipper buttons */
#controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:clamp(78px,15vh,124px)}
.flip{font-family:var(--display);font-size:13px;font-weight:700;color:var(--fg);border:0;cursor:pointer;touch-action:none;
  background:#5b5d66;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.08em;
  box-shadow:inset 0 0 0 3px #000, inset 4px 4px 0 3px #9b9da7, inset -4px -4px 0 3px #33343a}
.flip.down{background:#45474f;box-shadow:inset 0 0 0 3px #000, inset -4px -4px 0 3px #8a8c95, inset 4px 4px 0 3px #2a2b30;transform:translateY(2px)}
.flip .chev{width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent}
#flipL .chev{border-right:14px solid var(--gold)}
#flipR .chev{border-left:14px solid var(--gold)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Overlays */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:18px;box-sizing:border-box;text-align:center;background:#120e0bd9}
.overlay h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,9vw,40px);line-height:.95;margin:0;color:var(--gold);
  text-shadow:3px 3px 0 #5a3a0c, 6px 6px 0 #000;text-wrap:balance;letter-spacing:.02em}
.ver{font-size:10px;letter-spacing:.08em;color:var(--dim)}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.22em;color:var(--accent);margin:0}
.overlay .sub{margin:0;font-size:15px;color:var(--dim)}
.overlay h2{font-family:var(--display);font-size:13px;margin:0;color:var(--dim);letter-spacing:.14em}
.themes{display:flex;flex-direction:column;gap:8px;width:100%;max-width:260px}
.theme{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);color:var(--fg);border:0;padding:9px 10px;cursor:pointer;font-family:var(--body);
  box-shadow:inset 0 0 0 2px #000, inset 2px 2px 0 2px #ffffff12}
.theme[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent), inset 2px 2px 0 2px #ffffff12}
.theme{width:100%}
.sw{display:grid;grid-template-columns:repeat(2,10px);gap:2px;flex:none}
.sw i{width:10px;height:10px}
.theme b{display:block;font-family:var(--display);font-size:12px}
.theme span{font-size:12px;color:var(--dim)}
.soon{font-size:12px;color:var(--dim);margin:0}
.big{font-family:var(--display);font-size:17px;font-weight:700;color:#1d1406;background:var(--gold);border:0;padding:12px 30px;cursor:pointer;letter-spacing:.1em;
  box-shadow:inset 0 0 0 3px #000, inset 4px 4px 0 3px #ffe7a1, inset -4px -4px 0 3px #a77418}
.big:active{transform:translateY(2px)}
.help{font-size:13px;line-height:1.4;color:var(--dim);max-width:30ch;margin:0}
.final{font-family:var(--display);font-size:28px;color:var(--fg);margin:0;font-variant-numeric:tabular-nums}
.best{font-size:14px;color:var(--accent);margin:0}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="cell" id="scoreCell"><small>SCORE</small><b id="score">0</b></div>
    <div class="cell"><small>BALL</small><div id="balls"></div></div>
    <div class="cell" id="multCell"><small>MULT</small><b id="mult">x1</b></div>
    <div class="cell" id="hiCell"><small>BEST</small><b id="hi">0</b></div>
    <button id="mute" aria-pressed="false" aria-label="Toggle sound">SND<br>ON</button>
    <button id="menuBtn" aria-label="Pause and change table">II<br>MENU</button>
  </div>

  <div id="mid">
    <div id="stage">
      <canvas id="cv" aria-label="Pinball table"></canvas>
      <div class="overlay" id="menu">
        <p class="brand">RANZPINBALL <span class="ver">v1.00</span></p>
        <h1 id="menuTitle">Block<br>Quarry</h1>
        <p class="sub">Pixel pinball for your thumbs</p>
        <h2>TABLE</h2>
        <div class="themes" id="themeList"></div>
                <button class="big" id="playBtn">PLAY</button>
        <p class="help">Drag the launcher on the right down and let go. Hold the buttons at the bottom to flip.</p>
      </div>
      <div class="overlay" id="pause" hidden>
        <h2>PAUSED</h2>
        <p class="final" id="pauseScore">0</p>
        <p class="best" id="pauseNote"></p>
        <button class="big" id="resumeBtn">KEEP PLAYING</button>
        <button class="theme" id="quitBtn" style="justify-content:center;max-width:220px"><b>CHANGE TABLE</b></button>
        <p class="help">Changing table ends this game.</p>
        <p class="ver">RanzPinball v1.00</p>
      </div>
      <div class="overlay" id="over" hidden>
        <h2>GAME OVER</h2>
        <p class="final" id="finalScore">0</p>
        <p class="best" id="bestNote"></p>
        <button class="big" id="againBtn">PLAY AGAIN</button>
        <button class="theme" id="toMenu" style="justify-content:center;max-width:180px"><b>CHANGE TABLE</b></button>
      </div>
    </div>
    <div id="launcher">
      <div id="rail" class="off" aria-label="Launcher: drag down and release">
        <div id="spring"></div>
        <div id="knob">PULL</div>
        <div id="meter"></div>
      </div>
      <div id="launchLabel">LAUNCH</div>
    </div>
  </div>

  <div id="controls">
    <button class="flip" id="flipL" aria-label="Left flipper"><span class="chev"></span>LEFT</button>
    <button class="flip" id="flipR" aria-label="Right flipper">RIGHT<span class="chev"></span></button>
  </div>
</div>

<script>
(()=>{
"use strict";
// ---------- Themes ----------
// Each theme supplies colors, texture recipes and table wording. Geometry and physics are shared.
const THEMES={
  quarry:{
    name:"Block Quarry",
    blurb:"Ore bumpers, mossy slings, plank flippers",
    swatch:["#68a845","#866043","#5fd6c8","#f2c14e"],
    lanes:"DIG",
    bankName:"VEIN",
    dirt:["#866043","#6c4b32","#9b7653","#5d4029","#7a5639"],
    field:["#34353c","#2e2f35","#3a3b43","#292a30","#313239"],
    seam:"#1f2025",
    grass:["#5f9e3c","#4f8a30","#76b852"],
    moss:["#3f7a2a","#4c8f33","#336622","#5aa03c"],
    plank:["#a8834f","#9a7646","#b48e58","#8b693c"],
    stone:["#7d7d84","#6f6f76","#8b8b92","#64646a"],
    ores:[
      {name:"DIAMOND",c:["#2fb8ac","#5fd6c8","#b7f5ee"]},
      {name:"GOLD",c:["#c98f1d","#f2c14e","#fff0a6"]},
      {name:"EMERALD",c:["#17914a","#2fcf6c","#a8f5c2"]}
    ],
    msgAll:"VEIN CLEARED!",
    msgLanes:"DIG BONUS"
  },
  motor:{
    kind:"motor",
    name:"Motor Rally",
    blurb:"Tire bumpers, a spinner lane, cones and a checkpoint bank",
    swatch:["#d7322b","#f4f1ea","#2b2d31","#ffd23f"],
    ui:{accent:"#ff6a4d",gold:"#ffd23f",bg:"#121316",panel:"#25272c",hi:"#3a3d44",dim:"#9a9ca6"},
    lanes:"GAS",
    bankName:"CP",
    grassCols:["#3f7f35","#3a7731","#468a3b","#356d2d"],
    asphalt:["#2e3034","#2a2c30","#33353a","#27292d","#303237"],
    stone:["#f4f1ea","#cfd0d4","#2b2d31"],
    bumperCols:[["#111","#555","#ffd23f"],["#111","#555","#ff6a4d"],["#111","#555","#f4f1ea"]],
    msgAll:"CHECKERED FLAG!",
    msgLanes:"TURBO"
  }
};
THEMES.space={
  kind:"space",
  name:"Deep Space",
  blurb:"Sun and planet bumpers, a black hole, a warp lane and a passing spaceship",
  swatch:["#0d0e2a","#ffd166","#7fd8ff","#b388ff"],
  ui:{accent:"#7fd8ff",gold:"#ffd166",bg:"#0b0c1d",panel:"#1b1e3a",hi:"#2d3160",dim:"#959bc9"},
  lanes:"SKY",
  bankName:"STARS",
  stone:["#ffd166","#fff3b0","#7fd8ff"],
  bumperCols:[["#ff9f1c","#ffd166","#fff3b0"],["#8d93a8","#c9cede","#ffffff"],["#2a9d8f","#7fd8ff","#d6f6ff"]],
  msgAll:"STARS COLLECTED",
  msgLanes:"SKY BONUS"
};
THEMES.meadow={
  kind:"meadow",
  name:"Green Meadow",
  blurb:"Just grass and a few clouds. The easy one to start with",
  swatch:["#5cae3f","#8fd16a","#bfe6ff","#ffffff"],
  ui:{accent:"#9be36b",gold:"#ffe066",bg:"#0f1d10",panel:"#1e361c",hi:"#2f5329",dim:"#a3bd9c"},
  lanes:"",bankName:"",stone:["#ffffff"],bumperCols:[["#fff","#fff","#fff"]],msgAll:"",msgLanes:""
};
const THEME_ORDER=["meadow","quarry","motor","space"];
THEMES.quarry.kind="quarry";
THEMES.quarry.ui={accent:"#5fd6c8",gold:"#f2c14e",bg:"#15110e",panel:"#2b221b",hi:"#3d3127",dim:"#a39480"};
THEMES.quarry.bumperCols=THEMES.quarry.ores.map(o=>o.c);
let theme=null, T={}; // T holds built textures/patterns

// ---------- Utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function canvasOf(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

// ---------- Table geometry (logical 400 x 740) ----------
const W=400,H=740,R=9;
const LANE_X0=356,LANE_X1=394,LANE_CX=375,PLUNGER_Y=690,PULL_PX=44;
const segs=[];
function seg(ax,ay,bx,by,o={}){segs.push({ax,ay,bx,by,e:o.e??0.45,th:o.th??0,kick:o.kick||0,kind:o.kind||'wall',flash:0,cd:0});}
const ARC_CX=202,ARC_CY=200,ARC_R=192,arcPts=[];
for(let i=0;i<=28;i++){const a=Math.PI+Math.PI*i/28;arcPts.push([ARC_CX+Math.cos(a)*ARC_R,ARC_CY+Math.sin(a)*ARC_R]);}
const mir=x=>366-x;
const SL=[[56,470],[56,552.6],[96,593.5]];
const slings=[SL, SL.map(p=>[mir(p[0]),p[1]])];
const POSTS=[120,162,204,246];
const gate={ax:LANE_X0,ay:250,bx:LANE_X1,by:212,e:0.3,th:2,kick:0,kind:'gate',flash:0,cd:0};
const bumpers=[], targets=[], islands=[], rails=[];
let spinner=null, hole=null, warp=null, ship=null, warps=0, captured=0, holeCd=0;

// Shared frame (walls, slings, top lanes) plus the parts that differ per table.
function buildLayout(kind){
  segs.length=0;bumpers.length=0;targets.length=0;islands.length=0;rails.length=0;spinner=null;hole=null;warp=null;ship=null;warps=0;captured=0;
  for(let i=0;i<arcPts.length-1;i++)seg(arcPts[i][0],arcPts[i][1],arcPts[i+1][0],arcPts[i+1][1],{e:0.3,kind:'arc'});
  seg(10,540,10,200);                              // left wall
  seg(394,200,394,740);                            // outer right wall
  seg(LANE_X0,250,LANE_X0,740,{th:3,kind:'lane'}); // launch lane wall
  seg(10,540,100,632);                             // left inlane guide
  seg(356,540,266,632);                            // right inlane guide
  const simple=kind==='meadow';
  if(!simple)for(const s of slings){
    seg(s[0][0],s[0][1],s[1][0],s[1][1],{th:2,kind:'sling'});
    seg(s[1][0],s[1][1],s[2][0],s[2][1],{th:2,kind:'sling'});
    seg(s[0][0],s[0][1],s[2][0],s[2][1],{th:2,kick:430,e:0.2,kind:'kicker'});
  }
  if(!simple)for(const x of POSTS)seg(x,78,x,118,{th:3,kind:'post'});
  const B=(x,y,r)=>bumpers.push({x,y,r,ore:bumpers.length,flash:0,cd:0,rot:0});
  if(simple){
    // three soft clouds and nothing else
    for(const [x,y] of [[112,236],[252,214],[184,350]])islands.push({x,y,r:22,e:0.55,kick:140,pts:25,kind:'cloud',flash:0,cd:0});
  }else if(kind==='motor'){
    // left pit lane with a spinner across it
    seg(62,236,62,430,{th:3,kind:'rail'});rails.push([62,236,62,430]);
    spinner={x0:14,x1:58,y:330,a:0,w:0,half:0};
    B(150,205,20);B(232,205,20);B(191,272,20);
    islands.push({x:112,y:352,r:7,e:0.75,kick:0,pts:25,kind:'cone',flash:0,cd:0});
    islands.push({x:254,y:352,r:7,e:0.75,kick:0,pts:25,kind:'cone',flash:0,cd:0});
    islands.push({x:183,y:392,r:14,e:0.5,kick:280,pts:50,kind:'island',flash:0,cd:0});
    for(const y of [302,342,382])targets.push({x:341,y,w:14,h:32,hp:2,cd:0,flash:0});
  }else if(kind==='space'){
    // left warp lane, sun and two planets, a black hole in mid-field, a star bank under the top lanes
    seg(62,236,62,430,{th:3,kind:'rail'});rails.push([62,236,62,430]);
    warp={x0:14,x1:58,y:330,cd:0,flash:0};
    hole={x:183,y:370,pull:78,a:0};
    B(183,212,24);B(118,268,18);B(250,268,18);
    islands.push({x:106,y:424,r:8,e:0.7,kick:0,pts:25,kind:'rock',flash:0,cd:0,seed:3});
    islands.push({x:260,y:424,r:8,e:0.7,kick:0,pts:25,kind:'rock',flash:0,cd:0,seed:9});
    for(const x of [141,183,225])targets.push({x,y:150,w:30,h:14,hp:2,cd:0,flash:0});
  }else{
    B(130,222,22);B(236,222,22);B(183,302,22);
    for(const x of [140,183,226])targets.push({x,y:404,w:36,h:16,hp:2,cd:0,flash:0});
  }
}

class Flipper{
  constructor(px,py,side){this.px=px;this.py=py;this.side=side;this.L=66;this.rest=0.52;this.up=-0.45;this.a=this.rest;this.w=0;this.pressed=false;}
  tip(){return[this.px+this.side*Math.cos(this.a)*this.L,this.py+Math.sin(this.a)*this.L];}
  update(dt){const tgt=this.pressed?this.up:this.rest,sp=26,prev=this.a;
    if(this.a>tgt)this.a=Math.max(tgt,this.a-sp*dt);else if(this.a<tgt)this.a=Math.min(tgt,this.a+sp*dt);
    this.w=(this.a-prev)/dt;}
}
const flipL=new Flipper(100,632,1), flipR=new Flipper(266,632,-1);

// ---------- Game state ----------
const ball={x:LANE_CX,y:PLUNGER_Y-R,vx:0,vy:0};
let state='menu', score=0, balls=3, mult=1, lanes=[0,0,0], laneIn=[false,false,false];
let inPlay=false, saveAvail=true, ballSave=0, pull=0, pullVis=0, charging=false, keyCharge=false;
let hi=+(store('bq_hi')||0), shootT=3, shoot=null, slowT=0, bankReset=0, msg=null;
const pops=[], parts=[];

function plY(){return PLUNGER_Y+pullVis*PULL_PX;}
function inLane(){return ball.x>LANE_X0&&ball.y>262;}
function onPlunger(){return inLane()&&ball.y>PLUNGER_Y-70&&Math.abs(ball.vy)<450;}
function add(p,x,y){const v=p*mult;score+=v;if(x!==undefined)pops.push({x,y,t:0.8,txt:'+'+v});}
function say(text,t=1.6){msg={text,t,max:t};}
function placeBall(){ball.x=LANE_CX;ball.y=PLUNGER_Y-R-1;ball.vx=ball.vy=0;inPlay=false;pull=0;}
function newGame(){saveAvail=true;warps=0;ship=null;captured=0;holeCd=0;score=0;balls=3;mult=1;lanes=[0,0,0];targets.forEach(t=>t.hp=2);bankReset=0;placeBall();state='ready';say('BALL 1');hud();}

// ---------- Audio ----------
let ac=null, muted=store('bq_mute')==='1';
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();}
function sfx(f,d=0.08,type='square',vol=0.06,slide=0){
  if(muted||!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.03);}

// ---------- Physics ----------
function burst(x,y,cols,n=8){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*180;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0.5+Math.random()*0.4,c:cols[i%cols.length],s:2+Math.random()*3|0});}}

function collideSeg(s){
  const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;

  const px=s.ax+dx*t,py=s.ay+dy*t;let nx=ball.x-px,ny=ball.y-py;const d=Math.hypot(nx,ny),min=R+s.th;

  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ball.vx-=(1+s.e)*vn*nx;ball.vy-=(1+s.e)*vn*ny;
    if(s.kick&&vn<-60&&s.cd<=0){ball.vx+=nx*s.kick;ball.vy+=ny*s.kick;s.flash=0.15;s.cd=0.08;add(50,ball.x,ball.y);sfx(300,0.07,'square',0.06,-120);}
    else if(vn<-260)sfx(90,0.04,'triangle',0.05);}
}
function collideFlipper(f){
  const [tx,ty]=f.tip(),dx=tx-f.px,dy=ty-f.py,l2=dx*dx+dy*dy;

}
function step(dt){
  flipL.update(dt);flipR.update(dt);
  if(captured>0){collideFlipper(flipL);collideFlipper(flipR);return;}
  ball.vy+=1100*dt;
  const sp=Math.hypot(ball.vx,ball.vy);if(sp>2200){ball.vx*=2200/sp;ball.vy*=2200/sp;}
  const prevY=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  for(const s of segs)collideSeg(s);
  if(inPlay)collideSeg(gate);
  // plunger floor
  const py=plY();
  if(ball.x>LANE_X0&&ball.y+R>py){ball.y=py-R;if(ball.vy>0)ball.vy=ball.vy>200?-ball.vy*0.25:0;}
  // bumpers
  for(const b of bumpers){const dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy),min=R+b.r;
    if(d<min&&d>0){const nx=dx/d,ny=dy/d;ball.x=b.x+nx*min;ball.y=b.y+ny*min;const vn=ball.vx*nx+ball.vy*ny;
      ball.vx-=vn*nx;ball.vy-=vn*ny;const out=Math.abs(vn)*0.5+560;ball.vx+=nx*out;ball.vy+=ny*out;
      if(b.cd<=0){b.cd=0.06;b.flash=0.18;add(100,b.x,b.y-26);sfx(520+b.ore*110,0.09,'square',0.06,260);burst(b.x+nx*b.r,b.y+ny*b.r,theme.bumperCols[b.ore],5);b.rot+=0.8;}}}
  // passive posts, cones and kicking islands
  for(const o of islands){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),min=R+o.r;
    if(d<min&&d>0){const nx=dx/d,ny=dy/d;ball.x=o.x+nx*min;ball.y=o.y+ny*min;const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=(1+o.e)*vn*nx;ball.vy-=(1+o.e)*vn*ny;
        if(o.cd<=0&&vn<-60){o.cd=0.08;o.flash=0.15;if(o.kick){ball.vx+=nx*o.kick;ball.vy+=ny*o.kick;}add(o.pts,o.x,o.y-o.r-8);sfx(o.kick?420:700,0.05,'square',0.05,o.kick?-150:0);}}}}
  // spinner: a sensor line across the pit lane

    if(d<R){if(d===0){nx=0;ny=1;}else{nx/=d;ny/=d;}ball.x=cx+nx*R;ball.y=cy+ny*R;const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=1.55*vn*nx;ball.vy-=1.55*vn*ny;}
      if(tg.cd<=0&&vn<-70){tg.cd=0.15;tg.flash=0.15;tg.hp--;
        if(tg.hp>0){add(250,tg.x,tg.y-14);crunch();burst(tg.x,tg.y,theme.stone,5);}
        else{add(750,tg.x,tg.y-14);crunch();sfx(160,0.15,'sawtooth',0.05,-80);burst(tg.x,tg.y,theme.stone,14);
          if(targets.every(t=>t.hp<=0)){add(5000);say(theme.msgAll);launchShip();sfx(660,0.25,'square',0.05,660);bankReset=2.2;}}}}}
  // top lanes
  if(theme.kind!=='meadow')for(let i=0;i<3;i++){const x0=POSTS[i],x1=POSTS[i+1],inside=ball.y>80&&ball.y<116&&ball.x>x0&&ball.x<x1;
    if(inside&&!laneIn[i]){laneIn[i]=true;if(!lanes[i]){lanes[i]=1;add(1000,(x0+x1)/2,70);sfx(880,0.08,'triangle',0.07);
      if(lanes.every(Boolean)){mult=Math.min(5,mult+1);add(5000);say(theme.msgLanes+' x'+mult);launchShip();sfx(990,0.3,'square',0.05,500);setTimeout(()=>lanes=[0,0,0],700);}}else add(100);}
    if(!inside)laneIn[i]=false;}
  // warp lane sensor
  if(warp&&warp.cd<=0&&ball.x>warp.x0&&ball.x<warp.x1&&(prevY-warp.y)*(ball.y-warp.y)<=0&&prevY!==ball.y){
    warp.cd=0.6;warp.flash=0.5;warps++;add(500,36,warp.y-16);sfx(600,0.15,'sine',0.06,600);
    if(warps>=3){warps=0;launchShip();}else say('WARP '+warps+'/3',1);}
  // black hole: gentle pull, capture at the centre
  if(hole&&holeCd<=0&&inPlay){const dx=hole.x-ball.x,dy=hole.y-ball.y,d=Math.hypot(dx,dy);
    if(d<hole.pull&&d>0){const f=1500*(1-d/hole.pull);ball.vx+=dx/d*f*dt;ball.vy+=dy/d*f*dt;}
    if(d<10){captured=1.0;ball.x=hole.x;ball.y=hole.y;ball.vx=ball.vy=0;add(2000,hole.x,hole.y-26);say('BLACK HOLE');sfx(70,0.9,'sine',0.09,-30);}}
  // spaceship
  if(ship&&ship.x>14&&ship.x<352){const dx=ball.x-ship.x,dy=ball.y-ship.y,d=Math.hypot(dx,dy),min=R+ship.r;
    if(d<min&&d>0){const nx=dx/d,ny=dy/d;ball.x=ship.x+nx*min;ball.y=ship.y+ny*min;const vn=ball.vx*nx+ball.vy*ny;
      ball.vx-=vn*nx;ball.vy-=vn*ny;ball.vx+=nx*650;ball.vy+=ny*650;
      add(10000,ship.x,ship.y-24);say('SHIP HIT!');crunch();sfx(900,0.6,'sawtooth',0.05,-800);
      burst(ship.x,ship.y,['#ffd166','#ff6a4d','#c9cede','#7fd8ff'],26);ship=null;}}

}

function launchShip(){
  if(theme.kind!=='space')return;
  if(ship){add(2500);return;}
  const dir=Math.random()<0.5?1:-1;ship={x:dir>0?-40:406,y:168,dir,t:0,r:17};
  setTimeout(()=>{if(ship)say('SPACESHIP!',1.4);},msg?900:0);sfx(220,0.7,'sine',0.05,440);
}
function drain(){
  if(ballSave>0){ballSave=0;saveAvail=false;say('BALL SAVED');sfx(500,0.2,'triangle',0.06,300);placeBall();state='ready';return;}
  balls--;sfx(200,0.5,'sawtooth',0.05,-160);
  if(balls<=0){gameOver();return;}
  saveAvail=true;ballSave=0;say('BALL '+(4-balls));placeBall();state='ready';
}
function gameOver(){
  state='over';const best=score>hi;if(best){hi=score;store('bq_hi_'+themeId,String(hi));}
  $('finalScore').textContent=score.toLocaleString('en-US');
  $('bestNote').textContent=best&&score>0?'New best score':'Best: '+hi.toLocaleString('en-US');
  $('over').hidden=false;hud();
}

function update(dt){
  // timers
  for(const s of segs){s.flash=Math.max(0,s.flash-dt);s.cd=Math.max(0,s.cd-dt);}
  for(const b of bumpers){b.flash=Math.max(0,b.flash-dt);b.cd=Math.max(0,b.cd-dt);}
  for(const t of targets){t.flash=Math.max(0,t.flash-dt);t.cd=Math.max(0,t.cd-dt);}
  for(const o of islands){o.flash=Math.max(0,o.flash-dt);o.cd=Math.max(0,o.cd-dt);}
  if(spinner){const s=spinner;s.a+=s.w*dt;s.w*=Math.exp(-1.6*dt);if(Math.abs(s.w)<0.3)s.w=0;
    const h=Math.floor(s.a/Math.PI);if(h!==s.half){s.half=h;add(100);sfx(180+Math.min(600,Math.abs(s.w)*12),0.04,'sawtooth',0.04);}}
  if(warp){warp.cd=Math.max(0,warp.cd-dt);warp.flash=Math.max(0,warp.flash-dt);}
  if(hole){hole.a+=dt*(captured>0?9:1.8);holeCd=Math.max(0,holeCd-dt);
    if(captured>0){captured-=dt;if(captured<=0){const a=-Math.PI/2+(Math.random()-0.5)*1.6;ball.vx=Math.cos(a)*980;ball.vy=Math.sin(a)*980;holeCd=1.3;sfx(260,0.35,'sawtooth',0.05,700);}}}
  if(ship){ship.t+=dt;ship.x+=ship.dir*75*dt;ship.y=168+Math.sin(ship.t*3)*6;
    if(ship.x<-60||ship.x>430){ship=null;say('SHIP ESCAPED',1.2);}}
  if(theme.kind==='space'){shootT-=dt;if(shootT<=0){shootT=4+Math.random()*6;shoot={x:40+Math.random()*260,y:30+Math.random()*200,t:0.7};}if(shoot){shoot.t-=dt;shoot.x+=260*dt;shoot.y+=110*dt;if(shoot.t<=0)shoot=null;}}
  if(bankReset>0){bankReset-=dt;if(bankReset<=0)targets.forEach(t=>t.hp=2);}
  if(msg){msg.t-=dt;if(msg.t<=0)msg=null;}
  for(let i=pops.length-1;i>=0;i--){pops[i].t-=dt;pops[i].y-=30*dt;if(pops[i].t<=0)pops.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t-=dt;p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t<=0)parts.splice(i,1);}

  if(keyCharge&&onPlunger())pull=Math.min(1,pull+dt*0.9);
  if(railPtr!==null&&onPlunger()){railHold=Math.min(1,railHold+dt*0.7);pull=Math.max(railDrag,railHold);}

    if(ballSave>0&&inPlay)ballSave-=dt;
    const n=Math.min(36,Math.ceil(dt*600)),h=dt/n;
    for(let i=0;i<n;i++)step(h);

    const resting=inLane()&&ball.y>PLUNGER_Y-30;

}

function release(){

    ball.y=Math.min(ball.y,plY()-R);ball.vy=-(380+1180*pull);state='play';ballSave=saveAvail?5:0;if(theme.kind==='motor'){sfx(70,0.5,'sawtooth',0.06,260);sfx(110,0.45,'square',0.03,330);}else sfx(140,0.25,'sawtooth',0.06,500);
  }

}

  ctx.fillStyle=space?'#ffd166':motor?'#ff8a80':T.lit2;ctx.fillRect(LANE_X0+6,py,LANE_X1-LANE_X0-12,2);

  for(const p of parts){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
  if(ship)drawShip(ship);
  ctx.drawImage(T.ball,ball.x-9,ball.y-9,18,18);
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.t*2);px(p.txt,p.x,p.y,9,'#fff');}ctx.globalAlpha=1;
  if(msg){const a=Math.min(1,msg.t*3,(msg.max-msg.t)*8);ctx.globalAlpha=a;
    ctx.fillStyle='#000000b0';ctx.fillRect(30,454,306,40);px(msg.text,183,475,14,T.msg);ctx.globalAlpha=1;}
}

// ---------- HUD + launcher UI ----------
let lastScore=-1,lastBalls=-1,lastMult=-1;
function hud(){
  if(score!==lastScore){$('score').textContent=score.toLocaleString('en-US');lastScore=score;}
  if(balls!==lastBalls){$('balls').innerHTML=[0,1,2].map(i=>`<i class="${i<balls?'':'gone'}"></i>`).join('');lastBalls=balls;}
  if(mult!==lastMult){$('mult').textContent='x'+mult;lastMult=mult;}
  $('hi').textContent=Math.max(hi,score).toLocaleString('en-US');
}
const rail=$('rail'),knob=$('knob'),spring=$('spring'),meter=$('meter');
let railH=300,knobH=58,travel=200;
function measureRail(){railH=rail.clientHeight;knobH=Math.round(clamp(railH*0.12,40,64));knob.style.height=knobH+'px';travel=Math.max(40,railH-knobH-16-28);}
let lastLaunchState='';
function launcherUI(){
  const ok=(state==='ready'||state==='play')&&onPlunger();
  const st=ok?(pull>0?'armed':'on'):'off';
  if(st!==lastLaunchState){rail.classList.toggle('off',!ok);rail.classList.toggle('armed',pull>0);lastLaunchState=st;
    knob.textContent=pull>0?'':'PULL';}
  if(pull>0)knob.textContent=Math.round(pull*100)+'%';
  const y=pullVis*travel;knob.style.transform=`translateY(${y}px)`;
  const top=8+y+knobH,sh=Math.max(8,railH-8-top);spring.style.top=top+'px';spring.style.backgroundSize=`100% ${Math.max(3,sh/12)}px`;
  meter.style.height=(pullVis*(railH-6))+'px';
  hud();
}

// ---------- Input ----------
let railPtr=null,railStart=0,railDrag=0,railHold=0;
rail.addEventListener('pointerdown',e=>{audio();e.preventDefault();
  if(!((state==='ready'||state==='play')&&inLane()))return;
  railPtr=e.pointerId;railStart=e.clientY;railDrag=0;railHold=0;charging=true;rail.setPointerCapture(e.pointerId);});
rail.addEventListener('pointermove',e=>{if(e.pointerId!==railPtr)return;
  railDrag=clamp((e.clientY-railStart)/travel,0,1);pull=Math.max(railDrag,railHold);});
const endRail=e=>{if(e.pointerId!==railPtr)return;railPtr=null;release();};
rail.addEventListener('pointerup',endRail);rail.addEventListener('pointercancel',endRail);

function setFlip(f,on){if(f.pressed===on)return;f.pressed=on;
  if(on){sfx(120,0.05,'square',0.05,-40);if(state==='play'||state==='ready'){lanes=f===flipL?[lanes[1],lanes[2],lanes[0]]:[lanes[2],lanes[0],lanes[1]];}}
  (f===flipL?$('flipL'):$('flipR')).classList.toggle('down',on);}
function bindFlip(el,f){const ids=new Set();
  el.addEventListener('pointerdown',e=>{audio();e.preventDefault();ids.add(e.pointerId);el.setPointerCapture(e.pointerId);setFlip(f,true);});
  const up=e=>{ids.delete(e.pointerId);if(!ids.size)setFlip(f,false);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());}
bindFlip($('flipL'),flipL);bindFlip($('flipR'),flipR);

const LK=['ArrowLeft','KeyZ','ShiftLeft','KeyA'],RK=['ArrowRight','KeyM','ShiftRight','Slash','KeyL'],PK=['Space','ArrowDown','Enter'];
addEventListener('keydown',e=>{if(e.repeat)return;audio();
  if(LK.includes(e.code)){setFlip(flipL,true);e.preventDefault();}
  else if(RK.includes(e.code)){setFlip(flipR,true);e.preventDefault();}
  else if(PK.includes(e.code)){e.preventDefault();if(state!=='ready'&&state!=='play')return;if(inLane())keyCharge=true;}});
addEventListener('keyup',e=>{
  if(LK.includes(e.code))setFlip(flipL,false);
  else if(RK.includes(e.code))setFlip(flipR,false);
  else if(PK.includes(e.code)&&keyCharge)release();});

$('mute').addEventListener('click',()=>{muted=!muted;store('bq_mute',muted?'1':'0');syncMute();audio();});
function syncMute(){$('mute').setAttribute('aria-pressed',muted);$('mute').innerHTML=muted?'SND<br>OFF':'SND<br>ON';}

let themeId=store('bq_theme')||'meadow';if(!THEMES[themeId])themeId='meadow';
function renderThemes(){$('themeList').innerHTML=THEME_ORDER.map(id=>[id,THEMES[id]]).map(([id,t])=>
  `<button class="theme" data-id="${id}" aria-pressed="${id===themeId}"><span class="sw">${t.swatch.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span><b>${t.name}</b><span>${t.blurb}</span></span></button>`).join('');}
$('themeList').addEventListener('click',e=>{const b=e.target.closest('.theme');if(!b)return;themeId=b.dataset.id;store('bq_theme',themeId);buildTheme(themeId);renderThemes();placeBall();hud();});
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}}
$('playBtn').addEventListener('click',()=>{audio();wake();$('menu').hidden=true;newGame();});
$('againBtn').addEventListener('click',()=>{audio();$('over').hidden=true;newGame();});
let pausedFrom=null;
function pauseGame(){
  if(state!=='ready'&&state!=='play')return;
  pausedFrom=state;state='paused';release();setFlip(flipL,false);setFlip(flipR,false);
  $('pauseScore').textContent=score.toLocaleString('en-US');
  $('pauseNote').textContent=theme.name+' \u00b7 ball '+(4-balls)+' of 3';
  $('pause').hidden=false;$('resumeBtn').focus();
}
function resumeGame(){if(state!=='paused')return;$('pause').hidden=true;state=pausedFrom||'play';pausedFrom=null;last=performance.now();}
function openMenu(){$('pause').hidden=true;$('over').hidden=true;$('menu').hidden=false;state='menu';pausedFrom=null;
  buildTheme(themeId);placeBall();renderThemes();hud();}
$('menuBtn').addEventListener('click',()=>{audio();if(state==='paused')resumeGame();else if(state==='ready'||state==='play')pauseGame();else openMenu();});
$('resumeBtn').addEventListener('click',resumeGame);
$('quitBtn').addEventListener('click',openMenu);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();state==='paused'?resumeGame():pauseGame();}});

window.appPause=pauseGame;
window.appBack=()=>{if(state==='ready'||state==='play'){pauseGame();return true;}
  if(state==='paused'){resumeGame();return true;}
  if(state==='over'){openMenu();return true;}return false;};
$('toMenu').addEventListener('click',()=>{$('over').hidden=true;$('menu').hidden=false;state='menu';placeBall();renderThemes();});

// ---------- Sizing ----------
function resize(){
  const mid=$('mid'),mw=mid.clientWidth-54-8,mh=mid.clientHeight;
  const s=Math.max(0.3,Math.min(mw/W,mh/H)),cw=Math.floor(W*s),ch=Math.floor(H*s),dpr=Math.min(3,devicePixelRatio||1);
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  $('stage').style.width=cw+'px';$('launcher').style.height=ch+'px';$('launcher').style.alignSelf='center';
  measureRail();
}
addEventListener('resize',resize);
if(window.visualViewport)visualViewport.addEventListener('resize',resize);

// ---------- Loop ----------
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame);}
buildTheme(themeId);renderThemes();syncMute();resize();hud();
if(document.fonts&&document.fonts.load)document.fonts.load('700 12px Silkscreen').catch(()=>{});
requestAnimationFrame(frame);
})();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
